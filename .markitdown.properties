# MarkItDown Java CLI configuration
# This file uses the same keys consumed by ConfigurationManager.

# ------------------------------------------------------------
# OCR
# ------------------------------------------------------------

# Enable OCR for scanned PDFs and images
ocr.enable=false

# OCR backend: tess4j, tesseract-cli, paddleocr, http
ocr.engine=tess4j

# OCR language, for example: auto, eng, chi_sim
ocr.language=auto

# Remote OCR settings
ocr.endpoint=
ocr.api.key=
ocr.model=
ocr.timeout=30000
ocr.poll.interval=5000

# Local OCR paths
tesseract.path=
tessdata.path=

# ------------------------------------------------------------
# Output
# ------------------------------------------------------------

output.dir=./output
output.image.dir=assets
output.temp.dir=
output.organize.by.type=false
output.preserve.structure=false

# ------------------------------------------------------------
# Content
# ------------------------------------------------------------

content.include.metadata=true
content.include.images=true
content.include.tables=true

# ------------------------------------------------------------
# Rendering
# ------------------------------------------------------------

format.image=markdown
format.table=github

# ------------------------------------------------------------
# Performance
# ------------------------------------------------------------

performance.parallel=false
performance.threads=0
performance.optimize.memory=false
performance.max.file.size=52428800
performance.batch.size=20

# ------------------------------------------------------------
# UI
# ------------------------------------------------------------

ui.verbose=false
ui.quiet=false
ui.progress=false
ui.interactive=false
ui.stats=false

# ------------------------------------------------------------
# File processing
# ------------------------------------------------------------

files.recursive=false
files.batch=false
files.large.file=false

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------

logging.level=1
