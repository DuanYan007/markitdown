tesseract:
  path: ""

tessdata:
  path: ""

output:
  dir: ./output
  image_dir: assets
  temp_dir: ""
  organize_by_type: false
  preserve_structure: false

content:
  include_metadata: true
  include_images: true
  include_tables: true
  page_break_mode: heading

ocr:
  enabled: false
  engine: tesseract-cli
  language: auto
  endpoint: ""
  api_key: ""
  model: ""
  timeout: 30000
  poll_interval: 5000

format:
  image: markdown
  table: github

performance:
  parallel: false
  threads: 0
  optimize_memory: false
  max_file_size: 52428800
  batch_size: 20

ui:
  verbose: false
  quiet: false
  progress: false
  stats: false

files:
  recursive: false
  batch: false
  large_file: false
